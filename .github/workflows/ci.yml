name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ────────────────────────────────────────────────────────────
  # Linux build + test
  # ────────────────────────────────────────────────────────────
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libgsl-dev

      - name: Configure (Release)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel $(nproc)

  # ────────────────────────────────────────────────────────────
  # macOS build + test (catches Apple-specific linker issues)
  # ────────────────────────────────────────────────────────────
  macos:
    name: macOS (Homebrew GSL)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja gsl

      - name: Configure (Release)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel $(sysctl -n hw.logicalcpu)

  # ────────────────────────────────────────────────────────────
  # Debug build (catches UB / memory errors via sanitizers)
  # ────────────────────────────────────────────────────────────
  linux-debug:
    name: Linux (Debug + ASan/UBSan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libgsl-dev

      - name: Configure (Debug + sanitizers)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        working-directory: build
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:abort_on_error=1"
        run: ctest --output-on-failure --parallel $(nproc)

  # ────────────────────────────────────────────────────────────
  # pthreads variant
  # ────────────────────────────────────────────────────────────
  linux-pthreads:
    name: Linux (pthreads variant)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libgsl-dev

      - name: Configure (pthreads ON)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLAFP_USE_PTHREADS=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel $(nproc)
