[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lafp"
version = "1.0.0"
description = "Python bindings for Locally Adaptive Factor Process (LAFP) MCMC sampler"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "LAFP Contributors"}
]
dependencies = [
    "numpy>=1.20.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["python"]
